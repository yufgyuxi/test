name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS archive
        run: flutter build ipa --release --no-codesign[cite: 4]

      - name: Manually Export IPA from Archive
        run: |
          # 创建标准的 XML 格式导出配置 plist 文件
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

          # 寻找生成的 .xcarchive 路径
          ARCHIVE_PATH=$(find build/ios/archive -name "*.xcarchive" | head -n 1)
          
          # 执行强行导出为 ipa
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" -exportPath "build/ios/ipa" -exportOptionsPlist ExportOptions.plist[cite: 4]

      - name: Upload unsigned IPA and archive
        uses: actions/upload-artifact@v4
        with:
          name: nebula-ios-unsigned-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 7
          path: |
            build/ios/ipa/*.ipa
            build/ios/archive/*.xcarchive[cite: 4]